services:
  - type: web
    name: allfast-event-signup
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: EVENT_SLUG
        value: tailgate-thursday-2026-09-03
      - key: EVENT_NAME
        value: Tailgate Thursday
      - key: EVENT_DATE
        value: September 3, 2026
      - key: FACEBOOK_URL
        value: https://www.facebook.com/ALLFASTSupply/
      - key: INSTAGRAM_URL
        value: https://www.instagram.com/allfastsupply
      - key: GOOGLE_REVIEW_URL
        value: https://g.page/r/CZ8MDzS2WY6AEAE/review
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: allfast-event-db
          property: connectionString

databases:
  - name: allfast-event-db
    plan: basic-256mb
